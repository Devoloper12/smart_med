<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assigned Patients - SmartMed Caregiver Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#patientsNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="patientsNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4"></ul>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Header & Action Bar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3 action-header-bar">
      <div>
        <h2 class="fw-bold mb-1">Assigned Patients</h2>
        <div class="text-muted small">
          Active roster of patients under your caregiver monitoring and health oversight &bull;
          <span id="patients-count-badge" class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1 ms-1">0 Patients</span>
        </div>
      </div>

      <div class="d-flex gap-2">
        <a href="patient-tracking.html" class="btn btn-primary-health btn-sm rounded-pill px-3">
          <i class="fa-solid fa-chart-line me-1"></i> Patient Tracking
        </a>
      </div>
    </div>

    <!-- Search & Filter Controls -->
    <div class="row g-3 mb-4">
      <div class="col-md-8 col-lg-9">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="form-control border-start-0" id="patients-search" placeholder="Search patients by name, email, or medical condition...">
        </div>
      </div>

      <div class="col-md-4 col-lg-3">
        <select class="form-select" id="patients-status-filter">
          <option value="all" selected>All Statuses</option>
          <option value="Stable">Stable</option>
          <option value="Needs Attention">Needs Attention</option>
          <option value="Critical">Critical SOS</option>
        </select>
      </div>
    </div>

    <!-- Patients Directory Grid Container -->
    <div class="row" id="patients-directory-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted small">Loading assigned patients...</div>
      </div>
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/patients.js"></script>
</body>
</html>
