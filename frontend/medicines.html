<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicines Management - SmartMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#medNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="medNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="medicines.html"><i class="fa-solid fa-pills me-1"></i> Medicines</a></li>
          <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="fa-solid fa-bell me-1"></i> Reminders</a></li>
          <li class="nav-item"><a class="nav-link" href="prescriptions.html"><i class="fa-solid fa-file-prescription me-1"></i> Prescriptions</a></li>
          <li class="nav-item"><a class="nav-link" href="caregivers.html"><i class="fa-solid fa-hand-holding-heart me-1"></i> Caregivers</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Header & Action Bar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3 action-header-bar">
      <div>
        <h2 class="fw-bold mb-1">Medication Management</h2>
        <div class="text-muted small">
          Maintain active prescriptions, dosages, and daily consumption instructions &bull;
          <span id="medicines-count-badge" class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1 ms-1">0 Medicines</span>
        </div>
      </div>

      <button class="btn btn-primary-health btn-sm rounded-pill px-4 w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#medicineModal">
        <i class="fa-solid fa-plus me-1"></i> Add New Medicine
      </button>
    </div>

    <!-- Search & Filter Controls -->
    <div class="row g-3 mb-4">
      <div class="col-md-8 col-lg-9">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="form-control border-start-0" id="medicine-search" placeholder="Search by medicine name, dosage, or instructions...">
        </div>
      </div>

      <div class="col-md-4 col-lg-3">
        <select class="form-select" id="status-filter">
          <option value="all" selected>All Statuses</option>
          <option value="Active">Active Only</option>
          <option value="Completed">Completed</option>
          <option value="Paused">Paused</option>
        </select>
      </div>
    </div>

    <!-- Medicines Grid Container -->
    <div class="row" id="medicines-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted small">Loading medications...</div>
      </div>
    </div>

  </main>

  <!-- Add / Edit Medicine Modal -->
  <div class="modal fade" id="medicineModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="medicineModalLabel">Add New Medicine</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="medicine-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Medicine Name *</label>
              <input type="text" class="form-control" id="med-name" required placeholder="e.g., Metformin HCl, Lisinopril">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Dosage *</label>
                <input type="text" class="form-control" id="med-dosage" required placeholder="e.g., 500mg, 1 tablet, 5ml">
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Frequency *</label>
                <select class="form-select" id="med-frequency" required>
                  <option value="Once daily">Once daily</option>
                  <option value="Twice daily">Twice daily</option>
                  <option value="Three times daily">Three times daily (8h)</option>
                  <option value="Four times daily">Four times daily (6h)</option>
                  <option value="As needed">As needed (SOS)</option>
                </select>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Start Date *</label>
                <input type="date" class="form-control" id="med-start-date" required>
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">End Date *</label>
                <input type="date" class="form-control" id="med-end-date" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Instructions / Guidance</label>
              <input type="text" class="form-control" id="med-instructions" placeholder="Take after breakfast with a full glass of water">
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Status</label>
              <select class="form-select" id="med-status">
                <option value="Active" selected>Active</option>
                <option value="Paused">Paused</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-health btn-sm rounded-pill px-4" id="save-medicine-btn">
              <i class="fa-solid fa-plus me-1"></i> Add Medicine
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/medicines.js"></script>
</body>
</html>
