<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Profile - SmartMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#profileNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="profileNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4"></ul>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Header -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3 action-header-bar">
      <div>
        <h2 class="fw-bold mb-1">Caregiver Account & Profile</h2>
        <div class="text-muted small">
          Account credentials, assigned patient monitoring status, and notification configurations.
        </div>
      </div>

      <div class="d-flex gap-2">
        <button id="logout-profile-btn" class="btn btn-outline-danger btn-sm rounded-pill px-3">
          <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
        </button>
      </div>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-lg-8">
        <!-- Profile Card -->
        <div class="health-card p-4 mb-4 shadow-sm">
          <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div class="rounded-circle bg-primary bg-opacity-10 text-primary p-3 d-flex align-items-center justify-content-center flex-shrink-0" style="width: 64px; height: 64px;">
              <i class="fa-solid fa-user-shield fs-2"></i>
            </div>
            <div>
              <h4 class="fw-bold mb-0" id="prof-name">Caregiver Name</h4>
              <div class="text-muted small" id="prof-email">caregiver@example.com</div>
              <span class="badge bg-info text-dark rounded-pill px-3 py-1 mt-1 small">
                <i class="fa-solid fa-eye me-1"></i> Role: Caregiver (Monitor-Only)
              </span>
            </div>
          </div>

          <h6 class="fw-bold mb-3"><i class="fa-solid fa-circle-info me-2 text-primary"></i>Account Details</h6>
          <div class="row g-3 mb-4">
            <div class="col-sm-6">
              <label class="form-label small text-muted">Full Name</label>
              <input type="text" class="form-control" id="prof-input-name" readonly>
            </div>
            <div class="col-sm-6">
              <label class="form-label small text-muted">Email Address</label>
              <input type="email" class="form-control" id="prof-input-email" readonly>
            </div>
            <div class="col-sm-6">
              <label class="form-label small text-muted">Registered Role</label>
              <input type="text" class="form-control" value="Caregiver (Read-Only Monitor)" readonly>
            </div>
            <div class="col-sm-6">
              <label class="form-label small text-muted">Permissions</label>
              <input type="text" class="form-control" value="Telemetry, Reports, Alerts, SOS Receiver" readonly>
            </div>
          </div>

          <h6 class="fw-bold mb-3"><i class="fa-solid fa-bell me-2 text-warning"></i>Emergency Alert Preferences</h6>
          <div class="d-flex flex-column gap-2 mb-3">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="pref-siren" checked>
              <label class="form-check-label small" for="pref-siren">Play Audio Alarm Siren during Patient Emergency SOS</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="pref-whatsapp" checked>
              <label class="form-check-label small" for="pref-whatsapp">Receive Instant WhatsApp Dispatch Links for Missed Doses</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="pref-sms" checked>
              <label class="form-check-label small" for="pref-sms">Receive High-Priority SMS Fallback Alerts</label>
            </div>
          </div>

          <button type="button" class="btn btn-primary-health btn-sm rounded-pill px-4" id="save-pref-btn">
            <i class="fa-solid fa-floppy-disk me-1"></i> Save Preferences
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
