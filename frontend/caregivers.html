<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Support Circle - SmartMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#cgNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="cgNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="medicines.html"><i class="fa-solid fa-pills me-1"></i> Medicines</a></li>
          <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="fa-solid fa-bell me-1"></i> Reminders</a></li>
          <li class="nav-item"><a class="nav-link" href="prescriptions.html"><i class="fa-solid fa-file-prescription me-1"></i> Prescriptions</a></li>
          <li class="nav-item"><a class="nav-link active" href="caregivers.html"><i class="fa-solid fa-user-doctor me-1"></i> Caregivers</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Header & Action Bar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3">
      <div>
        <h2 class="fw-bold mb-1">Caregiver Support Network</h2>
        <div class="text-muted small">
          Designate family members and doctors to receive automated alerts upon missed doses or SOS emergencies &bull;
          <span id="caregivers-count-badge" class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1 ms-1">0 Contacts</span>
        </div>
      </div>

      <button class="btn btn-primary-health btn-sm rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#caregiverModal">
        <i class="fa-solid fa-plus me-1"></i> Add Caregiver
      </button>
    </div>

    <!-- Caregivers Cards Grid -->
    <div class="row" id="caregivers-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted small">Loading caregiver circle...</div>
      </div>
    </div>

  </main>

  <!-- Add Caregiver Modal -->
  <div class="modal fade" id="caregiverModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="caregiverModalLabel">Add Caregiver</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="caregiver-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Caregiver Name *</label>
              <input type="text" class="form-control" id="cg-name" required placeholder="e.g., Hridya">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Phone Number *</label>
                <input type="tel" class="form-control" id="cg-phone" required placeholder="+91 98765 43210">
              </div>
              <div class="col-sm-6">
                <label class="form-label small fw-semibold">Relationship *</label>
                <input type="text" class="form-control" id="cg-relation" required placeholder="Spouse, Child, Doctor">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address (Optional)</label>
              <input type="email" class="form-control" id="cg-email" placeholder="caregiver@example.com">
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="cg-primary">
              <label class="form-check-label small" for="cg-primary">Set as Primary Emergency Contact</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-health btn-sm rounded-pill px-4" id="save-caregiver-btn">
              <i class="fa-solid fa-plus me-1"></i> Add Caregiver
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/caregivers.js"></script>
</body>
</html>
