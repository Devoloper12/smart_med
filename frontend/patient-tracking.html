<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Tracking - SmartMed Caregiver Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#careNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="careNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <!-- Dynamic navigation links auto-injected by app.js based on role -->
        </ul>

        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Active SOS Emergency Notification Alert Banner (if triggered) -->
    <div id="sos-alert-container"></div>

    <!-- Header & Search Bar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3 action-header-bar">
      <div>
        <div class="d-flex align-items-center gap-2">
          <h2 class="fw-bold mb-0">Patient Tracking & Telemetry</h2>
          <span class="badge bg-info text-dark rounded-pill px-3 py-1 small">
            <i class="fa-solid fa-shield-heart me-1"></i> Caregiver Live Monitor
          </span>
        </div>
        <div class="text-muted small mt-1">
          Monitor assigned patients, real-time medication compliance, location signals, and emergency status.
        </div>
      </div>

      <div class="d-flex gap-2">
        <a href="sos-notifications.html" class="btn btn-sm btn-outline-danger rounded-pill px-3">
          <i class="fa-solid fa-truck-medical me-1"></i> SOS Notifications
        </a>
        <a href="health-status.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">
          <i class="fa-solid fa-heart-pulse me-1"></i> Health Status
        </a>
      </div>
    </div>

    <!-- Search Patient & Filter Controls -->
    <div class="row g-3 mb-4">
      <div class="col-md-8 col-lg-9">
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input type="text" class="form-control border-start-0" id="patient-search" placeholder="Search assigned patients by name, blood group, or diagnosed condition...">
        </div>
      </div>

      <div class="col-md-4 col-lg-3">
        <select class="form-select" id="patient-status-filter">
          <option value="all" selected>All Patient Statuses</option>
          <option value="Stable">Stable & On Track</option>
          <option value="Needs Attention">Needs Attention</option>
          <option value="Critical">Critical SOS</option>
        </select>
      </div>
    </div>

    <!-- Assigned Patients Quick Selector Grid -->
    <div class="mb-4">
      <h6 class="fw-bold text-muted mb-2 text-uppercase small tracking-wide">
        <i class="fa-solid fa-users me-1 text-primary"></i> Assigned Patients Directory
      </h6>
      <div class="row g-3" id="assigned-patients-grid">
        <div class="col-12 text-center py-4">
          <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
          <span class="ms-2 text-muted small">Loading assigned patient telemetry...</span>
        </div>
      </div>
    </div>

    <!-- Detailed Tracking Spotlight for Selected Patient -->
    <div id="patient-detail-tracking-section">
      <!-- Injected dynamically by patient-tracking.js -->
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/patient-tracking.js"></script>
</body>
</html>
