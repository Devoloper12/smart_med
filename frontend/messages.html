<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caregiver Patient Messaging - SmartMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#msgNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="msgNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4"></ul>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Header & Action Bar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3 action-header-bar">
      <div>
        <h2 class="fw-bold mb-1">Patient Check-In & Messaging</h2>
        <div class="text-muted small">
          Direct communication with your monitored patients via WhatsApp, SMS, and in-app check-in &bull;
          <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-2 py-1 ms-1">Direct Patient Contact</span>
        </div>
      </div>

      <div class="d-flex gap-2">
        <a href="tel:+919876543210" class="btn btn-sm btn-outline-danger rounded-pill px-3">
          <i class="fa-solid fa-phone me-1"></i> Call Patient
        </a>
      </div>
    </div>

    <div class="row g-4">
      <!-- Left Column: Compose & Quick Templates -->
      <div class="col-lg-6">
        <div class="health-card p-4 h-100">
          <h5 class="fw-bold mb-3"><i class="fa-solid fa-paper-plane me-2 text-primary"></i>Send Message to Patient</h5>

          <!-- Quick Templates -->
          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Quick Check-In Templates (Click to fill):</label>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill template-btn" data-template="Hi! Just checking in to confirm: did you take your scheduled dose on time today?">
                💊 Did you take your medicine?
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill template-btn" data-template="Hello, checking in on you. How are you feeling right now? Please let me know if you need anything.">
                ❤️ How are you feeling?
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill template-btn" data-template="EMERGENCY FOLLOW-UP: An emergency alert was logged on your SmartMed account. Please confirm you are safe immediately.">
                🚨 Emergency Safety Check
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill template-btn" data-template="Reminder: You have an upcoming doctor appointment / prescription review scheduled soon.">
                📅 Doctor Appointment Reminder
              </button>
            </div>
          </div>

          <!-- Message Form -->
          <form id="caregiver-message-form">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Patient Phone Number</label>
              <input type="tel" class="form-control" id="msg-recipient-phone" value="+91 98765 43210" placeholder="+91 98765 43210" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Message Text</label>
              <textarea class="form-control" id="msg-content" rows="4" placeholder="Type your check-in message to patient..." required></textarea>
            </div>

            <div class="d-flex flex-wrap gap-2">
              <button type="submit" class="btn btn-primary-health rounded-pill px-4 flex-fill" id="send-msg-btn">
                <i class="fa-solid fa-paper-plane me-1"></i> Send & Log Message
              </button>
              <button type="button" class="btn btn-success rounded-pill px-4" id="direct-wa-btn">
                <i class="fa-brands fa-whatsapp me-1"></i> Open WhatsApp
              </button>
              <button type="button" class="btn btn-outline-primary rounded-pill px-3" id="direct-sms-btn">
                <i class="fa-solid fa-comment-sms me-1"></i> SMS
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Right Column: Sent Messages Feed -->
      <div class="col-lg-6">
        <div class="health-card h-100 d-flex flex-column">
          <div class="health-card-header d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0"><i class="fa-solid fa-comments me-2 text-primary"></i>Message History</h5>
            <span class="small text-muted" id="message-count-badge">0 Messages</span>
          </div>
          <div class="health-card-body p-3 flex-grow-1 overflow-auto" id="messages-stream-list" style="max-height: 480px;">
            <div class="text-center py-4 text-muted small">Loading message history...</div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
