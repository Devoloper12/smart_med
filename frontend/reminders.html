<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reminders & Adherence - SmartMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
      <a class="brand-logo" href="dashboard.html">
        <span class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></span>
        <span>Smart<span class="text-secondary">Med</span></span>
      </a>

      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#remNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="remNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fa-solid fa-gauge-high me-1"></i> Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="medicines.html"><i class="fa-solid fa-pills me-1"></i> Medicines</a></li>
          <li class="nav-item"><a class="nav-link active" href="reminders.html"><i class="fa-solid fa-bell me-1"></i> Reminders</a></li>
          <li class="nav-item"><a class="nav-link" href="prescriptions.html"><i class="fa-solid fa-file-prescription me-1"></i> Prescriptions</a></li>
          <li class="nav-item"><a class="nav-link" href="caregivers.html"><i class="fa-solid fa-hand-holding-heart me-1"></i> Caregivers</a></li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary btn-sm rounded-circle p-2" id="dark-mode-toggle">
            <i class="fa-solid fa-moon"></i>
          </button>
          <div id="nav-auth-section"></div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Header & Action Bar -->
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom gap-3 action-header-bar">
      <div>
        <h2 class="fw-bold mb-1">Medication Reminders</h2>
        <div class="text-muted small">
          Active dose alerts, audio notifications, and compliance timeline &bull;
          <span id="reminders-count-badge" class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-2 py-1 ms-1">0 Records</span>
        </div>
      </div>

      <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2 w-100 w-md-auto">
        <button id="test-chime-btn" class="btn btn-outline-secondary btn-sm rounded-pill px-3" title="Test synthesizer audio bell">
          <i class="fa-solid fa-volume-high me-1 text-primary"></i> Test Audio Chime
        </button>
        <button class="btn btn-primary-health btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#reminderModal">
          <i class="fa-solid fa-plus me-1"></i> Custom Reminder
        </button>
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="filter-pills-scroll gap-2 mb-4">
      <button class="btn btn-sm btn-outline-primary rounded-pill px-3 active" data-reminder-filter="today">Today's Doses</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill px-3" data-reminder-filter="upcoming">Upcoming Queue</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill px-3" data-reminder-filter="history">History Log</button>
      <button class="btn btn-sm btn-outline-primary rounded-pill px-3" data-reminder-filter="all">All Reminders</button>
    </div>

    <!-- Reminders Timeline Container -->
    <div id="reminders-container">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <div class="mt-2 text-muted small">Loading reminders...</div>
      </div>
    </div>

  </main>

  <!-- Create Custom Reminder Modal -->
  <div class="modal fade" id="reminderModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Set Custom Medicine Reminder</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="reminder-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Select Medicine *</label>
              <select class="form-select" id="reminder-medicine-select" required>
                <option value="">Loading medicines...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Reminder Date & Time *</label>
              <input type="datetime-local" class="form-control" id="reminder-datetime" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Personal Note</label>
              <input type="text" class="form-control" id="reminder-notes" placeholder="Take with yogurt / water">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary-health btn-sm rounded-pill px-4" id="save-reminder-btn">
              <i class="fa-solid fa-plus me-1"></i> Set Reminder
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/reminders.js"></script>
</body>
</html>
